<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Portrait — Robin Rosenbluth · The Life Shift</title>
<style>
  :root{
    --bg:#070a0c;
    --ink:#eef3f6;
    --muted:#8a97a1;
    --still:#5b6673;    /* Still — black/void, lifted to read on dark */
    --holding:#3b82f6;  /* Holding on — blue */
    --fire:#ef4444;     /* Fire — red */
    --push:#a855f7;     /* Push — purple */
    --full:#fbbf24;     /* Full — yellow */
    --electric:#22d3ee; /* Electric — cyan */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    overflow:hidden;}
  #stage{position:fixed;inset:0}
  canvas#field{position:absolute;inset:0;width:100%;height:100%;display:block}

  .overlay{position:absolute;inset:0;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(20px,4.5vw,60px);}
  .top{max-width:min(680px,86vw)}
  .eyebrow{font-size:clamp(11px,1.3vw,13px);letter-spacing:.28em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:0 0 clamp(10px,1.6vw,18px)}
  h1{font-size:clamp(30px,6vw,68px);line-height:1.02;margin:0;font-weight:700;letter-spacing:-.01em}
  .desc{font-size:clamp(14px,2vw,21px);line-height:1.5;color:#c7d0d6;margin:clamp(12px,1.8vw,20px) 0 0;
    max-width:38ch;font-weight:400}

  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .bars{display:flex;flex-direction:column;gap:clamp(7px,1.1vw,11px);width:min(560px,88vw)}
  .bar-row{display:grid;grid-template-columns:clamp(64px,9vw,96px) 1fr;align-items:center;gap:clamp(10px,1.4vw,16px)}
  .bar-label{font-size:clamp(11px,1.35vw,14px);letter-spacing:.06em;color:#aeb8bf;font-weight:600;text-transform:uppercase}
  .bar-track{position:relative;height:clamp(9px,1.3vw,13px);border-radius:20px;
    background:rgba(255,255,255,.06);overflow:hidden;display:flex}
  .seg{height:100%;width:0;transition:width 1.1s cubic-bezier(.22,.61,.36,1)}
  .foot{display:flex;flex-direction:column;gap:14px;align-items:flex-end;pointer-events:auto}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:flex-end;max-width:320px}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:clamp(10px,1.2vw,12px);color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%}
  .link{font-size:clamp(12px,1.4vw,15px);color:#cfd7dc;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:2px}
  .link:hover{color:#fff}
  .save{font:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;color:#0b0e10;
    background:#eef3f6;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;opacity:.9}
  .save:hover{opacity:1}
  @media (max-width:640px){ .foot{align-items:flex-start;width:100%} .legend{justify-content:flex-start} }
  @media (prefers-reduced-motion:reduce){ /* JS halts animation; static frame remains */ }
</style>
</head>
<body>
<div id="stage">
  <canvas id="field"></canvas>
  <div class="overlay">
    <div class="top">
      <p class="eyebrow">The Life Shift · SHIFTS Energy Portrait</p>
      <h1 id="title">Robin Rosenbluth</h1>
      <p class="desc" id="desc"></p>
    </div>
    <div class="bottom">
      <div class="bars" id="bars"></div>
      <div class="foot">
        <div class="legend" id="legend"></div>
        <a class="link" id="link" href="https://lineinthesandproject.com" target="_blank" rel="noopener">Explore the SHIFTS</a>
        <button class="save" id="save">Download PNG</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   EPISODE DATA BLOCK  (SHIFTS Energy Portrait — The Life Shift)
   Stages, in order: Stop, Hide, Identify, Face, Transform, Share
   Energies: Still(black) Holding on(blue) Fire(red) Push(purple) Full(yellow) Electric(cyan)
   Each 0-100, grounded in what the guest actually said.
   ============================================================ */
const EPISODE = {
  title: "Robin Rosenbluth",
  desc:  "A woman who lost her mother at eight and was sent to foster care at eleven, who slowly let people back in and built a life overflowing with love.",
  link:  "https://lineinthesandproject.com",
  linkLabel: "Explore the SHIFTS",
  energy: {
    Stop:      {black:80, blue:55, red:52, purple:45, yellow:8,  electric:10},
    Hide:      {black:72, blue:78, red:24, purple:60, yellow:12, electric:20},
    Identify:  {black:26, blue:36, red:64, purple:42, yellow:46, electric:56},
    Face:      {black:15, blue:24, red:70, purple:80, yellow:34, electric:42},
    Transform: {black:8,  blue:16, red:44, purple:40, yellow:76, electric:88},
    Share:     {black:5,  blue:10, red:24, purple:40, yellow:85, electric:92},
  }
};

/* ---------- palette ---------- */
const COLORS = {
  black:   getVar('--still'),
  blue:    getVar('--holding'),
  red:     getVar('--fire'),
  purple:  getVar('--push'),
  yellow:  getVar('--full'),
  electric:getVar('--electric'),
};
const ENERGY_LABEL = {
  black:"Still", blue:"Holding on", red:"Fire", purple:"Push", full:"Full", yellow:"Full", electric:"Electric"
};
const ORDER = ["black","blue","red","purple","yellow","electric"];
const STAGES = ["Stop","Hide","Identify","Face","Transform","Share"];
function getVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

/* ---------- seeded PRNG (from title) ---------- */
function seedFrom(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){
  h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return ()=> {
  h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);
  return ((h^=h>>>16)>>>0)/4294967296;};}
const rand = seedFrom(EPISODE.title);

/* ---------- build weighted orb pool ---------- */
const totals={}; ORDER.forEach(k=>totals[k]=0);
STAGES.forEach(s=>ORDER.forEach(k=>totals[k]+=EPISODE.energy[s][k]));
const grand = ORDER.reduce((a,k)=>a+totals[k],0)||1;

const canvas=document.getElementById('field');
const ctx=canvas.getContext('2d');
let W,H,DPR,orbs=[];
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;

function makeOrbs(){
  orbs=[];
  const N = 66;
  // weighted color list
  const pool=[];
  ORDER.forEach(k=>{const n=Math.max(1,Math.round((totals[k]/grand)*N));for(let i=0;i<n;i++)pool.push(k);});
  for(let i=0;i<pool.length;i++){
    const key=pool[i];
    const strength=totals[key]/grand;
    orbs.push({
      key,
      x:rand(), y:rand(),
      r:(0.10+rand()*0.22)*(0.7+strength*1.6),
      vx:(rand()-0.5)*0.00042,
      vy:(rand()-0.5)*0.00042,
      ph:rand()*Math.PI*2,
      pv:0.0006+rand()*0.0012,
      alpha:0.42+rand()*0.30,
    });
  }
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function drawOrb(g,o,w,h){
  const cx=o.x*w, cy=o.y*h, rad=o.r*Math.min(w,h);
  const [r,gr,b]=hexToRgb(COLORS[o.key]);
  const grad=g.createRadialGradient(cx,cy,0,cx,cy,rad);
  const puls=0.5+0.5*Math.sin(o.ph);
  const a=o.alpha*(0.62+0.38*puls);
  grad.addColorStop(0,`rgba(${r},${gr},${b},${a})`);
  grad.addColorStop(0.45,`rgba(${r},${gr},${b},${a*0.42})`);
  grad.addColorStop(1,`rgba(${r},${gr},${b},0)`);
  g.fillStyle=grad;
  g.beginPath();g.arc(cx,cy,rad,0,Math.PI*2);g.fill();
}

function frame(){
  ctx.clearRect(0,0,W,H);
  // subtle vignette base
  const bg=ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.8);
  bg.addColorStop(0,'rgba(18,26,32,0.9)');bg.addColorStop(1,'rgba(7,10,12,1)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const o of orbs){
    if(!REDUCED){
      o.x+=o.vx; o.y+=o.vy; o.ph+=o.pv;
      if(o.x<-0.3)o.x=1.3; if(o.x>1.3)o.x=-0.3;
      if(o.y<-0.3)o.y=1.3; if(o.y>1.3)o.y=-0.3;
    }
    drawOrb(ctx,o,W,H);
  }
  ctx.globalCompositeOperation='source-over';
  if(!REDUCED) requestAnimationFrame(frame);
}

/* ---------- SHIFTS bars ---------- */
function buildBars(){
  const wrap=document.getElementById('bars');
  wrap.innerHTML='';
  STAGES.forEach(s=>{
    const row=document.createElement('div');row.className='bar-row';
    const lab=document.createElement('div');lab.className='bar-label';lab.textContent=s;
    const track=document.createElement('div');track.className='bar-track';
    const vals=EPISODE.energy[s];
    const sum=ORDER.reduce((a,k)=>a+vals[k],0)||1;
    ORDER.forEach(k=>{
      const seg=document.createElement('div');seg.className='seg';
      seg.style.background=COLORS[k];
      seg.dataset.w=((vals[k]/sum)*100).toFixed(2);
      track.appendChild(seg);
    });
    row.appendChild(lab);row.appendChild(track);wrap.appendChild(row);
  });
  // animate in
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.seg').forEach((seg,i)=>{
      setTimeout(()=>{seg.style.width=seg.dataset.w+'%';}, 120+ i*8);
    });
  }));
}

function buildLegend(){
  const el=document.getElementById('legend');
  const seen=new Set();
  ORDER.forEach(k=>{
    const label=ENERGY_LABEL[k]; if(seen.has(label))return; seen.add(label);
    const s=document.createElement('span');
    s.innerHTML=`<span class="dot" style="background:${COLORS[k]}"></span>${label}`;
    el.appendChild(s);
  });
}

/* ---------- PNG export 1600x900 ---------- */
function exportPNG(){
  const w=1600,h=900;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  const bg=g.createRadialGradient(w/2,h*0.42,0,w/2,h*0.42,Math.max(w,h)*0.8);
  bg.addColorStop(0,'#121a20');bg.addColorStop(1,'#070a0c');
  g.fillStyle=bg;g.fillRect(0,0,w,h);
  g.globalCompositeOperation='lighter';
  for(const o of orbs) drawOrb(g,o,w,h);
  g.globalCompositeOperation='source-over';
  // soft dark scrim bottom+left for text legibility
  const scrim=g.createLinearGradient(0,0,0,h);
  scrim.addColorStop(0,'rgba(7,10,12,0.55)');scrim.addColorStop(0.5,'rgba(7,10,12,0.15)');scrim.addColorStop(1,'rgba(7,10,12,0.75)');
  g.fillStyle=scrim;g.fillRect(0,0,w,h);
  const M=90;
  g.textBaseline='top';
  g.fillStyle='#8a97a1';g.font='600 20px -apple-system,Segoe UI,Inter,Arial';
  g.fillText('THE LIFE SHIFT · SHIFTS ENERGY PORTRAIT'.split('').join(' '),M,M);
  g.fillStyle='#eef3f6';g.font='700 76px -apple-system,Segoe UI,Inter,Arial';
  g.fillText(EPISODE.title,M,M+38);
  // wrapped desc
  g.fillStyle='#c7d0d6';g.font='400 26px -apple-system,Segoe UI,Inter,Arial';
  wrapText(g,EPISODE.desc,M,M+140,760,34);
  // bars bottom
  const bx=M, bw=620, bh=14, gap=20; let by=h-M-(STAGES.length*(bh+gap));
  g.font='600 16px -apple-system,Segoe UI,Inter,Arial';
  STAGES.forEach(s=>{
    g.fillStyle='#aeb8bf';g.textBaseline='middle';
    g.fillText(s.toUpperCase(), bx, by+bh/2);
    const tx=bx+150, tw=bw-150;
    g.fillStyle='rgba(255,255,255,0.06)';roundRect(g,tx,by,tw,bh,7);g.fill();
    const vals=EPISODE.energy[s];const sum=ORDER.reduce((a,k)=>a+vals[k],0)||1;
    let cx=tx;
    ORDER.forEach(k=>{const seg=(vals[k]/sum)*tw;if(seg>0.5){g.fillStyle=COLORS[k];
      g.fillRect(cx,by,seg,bh);cx+=seg;}});
    by+=bh+gap;
  });
  g.textBaseline='top';g.fillStyle='#cfd7dc';g.font='500 20px -apple-system,Segoe UI,Inter,Arial';
  g.fillText(EPISODE.linkLabel+'  ·  lineinthesandproject.com', bx, h-M+2);

  const a=document.createElement('a');
  a.download='energy-portrait-robin.png';
  a.href=c.toDataURL('image/png');a.click();
}
function wrapText(g,text,x,y,maxW,lh){
  const words=text.split(' ');let line='',yy=y;
  for(const wd of words){const t=line?line+' '+wd:wd;
    if(g.measureText(t).width>maxW&&line){g.fillText(line,x,yy);line=wd;yy+=lh;}else line=t;}
  g.fillText(line,x,yy);
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- init ---------- */
document.getElementById('desc').textContent=EPISODE.desc;
document.getElementById('title').textContent=EPISODE.title;
const lk=document.getElementById('link');lk.href=EPISODE.link;lk.textContent=EPISODE.linkLabel;
document.getElementById('save').addEventListener('click',exportPNG);
buildBars();buildLegend();resize();makeOrbs();
if(REDUCED){ frame(); } else { requestAnimationFrame(frame); }
window.addEventListener('resize',()=>{resize();});
</script>
</body>
</html>
